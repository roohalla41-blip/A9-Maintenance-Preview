name: Deploy Afghanistan Old Preview

on:
  push:
    branches:
      - feature/gameplay-foundation
    paths:
      - "preview/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
