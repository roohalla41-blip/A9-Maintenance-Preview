name: Build Afghanistan Old Preview APK

on:
  push:
    branches:
      - feature/gameplay-foundation
    paths:
      - "preview/**"
      - "android-wrapper/**"
      - ".github/workflows/build-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate offline game JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("preview/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline game script")
          Path("/tmp/afghanistan-game.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/afghanistan-game.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare offline preview assets
        run: |
          mkdir -p android-wrapper/app/src/main/assets/preview
          cp -R preview/. android-wrapper/app/src/main/assets/preview/
      - name: Build debug APK
        working-directory: android-wrapper
        run: |
          gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghanistan-Old-Preview-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
