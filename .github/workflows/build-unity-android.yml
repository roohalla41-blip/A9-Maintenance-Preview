name: Build Unity Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Compile Unity project and package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Check Unity license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE repository secret is missing. Add a valid Unity license file as the UNITY_LICENSE secret before running this build."
            exit 1
          fi

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: AncientAfghanistanBuild.BuildAndroid
          buildName: AncientAfghanistan
          buildPath: Builds/Android
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Verify APK and create build manifest
        run: |
          APK="Builds/Android/AncientAfghanistan.apk"
          test -s "$APK"
          mkdir -p Builds/Android
          sha256sum "$APK" | tee Builds/Android/AncientAfghanistan.apk.sha256
          cat > Builds/Android/build-info.txt <<EOF
          Game: Afghanistan Old
          Build type: Unity Android APK
          Unity version: 2022.3.62f1
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Package: com.ancientafghanistan.game
          Version: 0.1.0 (1)
          Architecture: ARM64
          APK bytes: $(stat -c%s "$APK")
          EOF
          ls -lh "$APK" Builds/Android/AncientAfghanistan.apk.sha256 Builds/Android/build-info.txt
          file "$APK"

      - name: Upload installable Unity APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: Afghanistan-Old-Unity-Android-APK
          path: |
            Builds/Android/AncientAfghanistan.apk
            Builds/Android/AncientAfghanistan.apk.sha256
            Builds/Android/build-info.txt
          if-no-files-found: error
          retention-days: 14
