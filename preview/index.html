<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),gl=canvas.getContext("webgl",{antialias:true,alpha:false});if(!gl){alert("گرافیک سه‌بعدی در این دستگاه فعال نیست");return}
const vs="attribute vec3 p;attribute vec3 c;uniform mat4 vp;varying vec3 col;void main(){gl_Position=vp*vec4(p,1.0);col=c;}";
const fs="precision mediump float;varying vec3 col;void main(){gl_FragColor=vec4(col,1.0);}";
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);
const pLoc=gl.getAttribLocation(program,"p"),cLoc=gl.getAttribLocation(program,"c"),vpLoc=gl.getUniformLocation(program,"vp");let vertices=[],colors=[],bufferP=gl.createBuffer(),bufferC=gl.createBuffer(),vertexCount=0;
const rgb=h=>{h=h.replace("#","");return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]};
function tri(a,b,c,color){let q=Array.isArray(color)?color:rgb(color);for(const v of [a,b,c]){vertices.push(v[0],v[1],v[2]);colors.push(q[0],q[1],q[2])}}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color)}
function box(x,y,z,w,h,d,color){let x0=x-w/2,x1=x+w/2,y0=y-h/2,y1=y+h/2,z0=z-d/2,z1=z+d/2;quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],color);quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],color);quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],color);quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],color);quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],color);quad([x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0],color)}
function cylinder(x,y,z,r,h,color,n=9){for(let i=0;i<n;i++){let a=i*Math.PI*2/n,b=(i+1)*Math.PI*2/n,p1=[x+Math.cos(a)*r,y-h/2,z+Math.sin(a)*r],p2=[x+Math.cos(b)*r,y-h/2,z+Math.sin(b)*r],p3=[p2[0],y+h/2,p2[2]],p4=[p1[0],y+h/2,p1[2]];quad(p1,p2,p3,p4,color);tri([x,y+h/2,z],p4,p3,color)}}
function sphere(x,y,z,r,color){let n=7,m=10;for(let j=0;j<n;j++)for(let i=0;i<m;i++){let pt=(a,b)=>[x+r*Math.sin(a)*Math.cos(b),y+r*Math.cos(a),z+r*Math.sin(a)*Math.sin(b)],a=j*Math.PI/n,b=(j+1)*Math.PI/n,c=i*Math.PI*2/m,d=(i+1)*Math.PI*2/m;quad(pt(a,c),pt(b,c),pt(b,d),pt(a,d),color)}}
function roof(x,y,z,w,d,color){let a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],e=[x-w/2,y,z+d/2],top=[x,y+Math.min(w,d)*.34,z];tri(a,b,top,color);tri(b,c,top,color);tri(c,e,top,color);tri(e,a,top,color)}
function terrain(){let n=34,size=52,step=size/n;for(let z=0;z<n;z++)for(let x=0;x<n;x++){let xx=-26+x*step,zz=-26+z*step,h=(a,b)=>Math.sin(a*.23)*.22+Math.cos(b*.19)*.18+Math.sin((a+b)*.11)*.12;quad([xx,h(xx,zz),zz],[xx+step,h(xx+step,zz),zz],[xx+step,h(xx+step,zz+step),zz+step],[xx,h(xx,zz+step),zz+step],((x+z)%3===0)?"#716c43":"#777148")}}
let structures=[{kind:"tower-archer",x:-7,z:-9,hp:180,maxHp:180},{kind:"tower-sentinel",x:15,z:-12,hp:200,maxHp:200}],people=[],raiders=[],beasts=[],aircraft=[],wood=250,stone=150,food=200,gold=100,guards=2,buildMode=false,selected="house",raidTimer=45,raidNo=0;
function addHouse(x,z,scale=1,color="#b58c5d"){box(x,1*scale,z,3.2*scale,2*scale,3*scale,color);roof(x,2*scale,z,3.6*scale,3.4*scale,"#67442d");box(x,.72*scale,z-1.56*scale,.65*scale,1.42*scale,.12*scale,"#50301e")}
function addTower(x,z,kind="tower-archer"){const palette={ "tower-archer":["#3f8b75","#a8d9bd","#e1c77b"],"tower-cannon":["#8c5834","#d7a35b","#39464a"],"tower-sentinel":["#64727d","#c7d2d5","#e7d29b"],"tower-arcane":["#4f5ca0","#b8c8ff","#83d9ef"],"tower":["#3f8b75","#a8d9bd","#e1c77b"]}[kind]||["#3f8b75","#a8d9bd","#e1c77b"];const [base,trim,glow]=palette;cylinder(x,1.5,z,.95,3,base,12);cylinder(x,3.05,z,1.04,.22,trim,12);if(kind==="tower-cannon"){box(x,3.55,z,2.1,.95,2.1,base);cylinder(x,4.05,z,.46,.45,trim,12);cylinder(x,4.28,z,.19,1.05,"#303c40",10);cylinder(x,3.1,z,1.17,.18,glow,12)}else if(kind==="tower-sentinel"){box(x,3.5,z,2.25,1.15,2.25,base);for(let i=0;i<4;i++){let a=i*Math.PI/2;cylinder(x+Math.cos(a)*.83,4.25,z+Math.sin(a)*.83,.19,.75,trim,8)}box(x,4.08,z,.32,.65,.32,glow)}else if(kind==="tower-arcane"){cylinder(x,3.65,z,.72,1.1,base,9);cylinder(x,4.28,z,.28,.25,glow,9);sphere(x,4.75,z,.42,glow);for(let i=0;i<4;i++){let a=i*Math.PI/2;cylinder(x+Math.cos(a)*.72,3.75,z+Math.sin(a)*.72,.12,1.2,trim,7)}}else{box(x,3.45,z,2.1,1,2.1,base);for(let i=0;i<4;i++){let a=i*Math.PI/2;cylinder(x+Math.cos(a)*.68,4.08,z+Math.sin(a)*.68,.16,.65,trim,8)}cylinder(x,4.05,z,.24,.45,glow,8)}}
function addTree(x,z){cylinder(x,.75,z,.22,1.5,"#68452a",7);sphere(x,2,z,.95,"#456b38")}
function addQala(x,z,w=7,d=6){const wall="#a78b65";box(x,1.15,z-d/2,w,2.3,.45,wall);box(x,1.15,z+d/2,w,2.3,.45,wall);box(x-w/2,1.15,z,.45,2.3,d,wall);box(x+w/2,1.15,z,.45,2.3,d,wall);box(x,1.0,z+d/2,.9,1.65,.5,"#64452f");for(const [dx,dz] of [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]]){box(x+dx,2.55,z+dz,.8,.55,.8,"#b69a72");box(x+dx,2.9,z+dz,.35,.2,.35,"#8a704e")}}
function addMinaret(x,z){cylinder(x,2.0,z,.55,4,"#b99a70",12);cylinder(x,3.7,z,.72,.25,"#8c7658",12);cylinder(x,4.2,z,.4,.8,"#b99a70",12);sphere(x,4.75,z,.43,"#c7a96f");cylinder(x,5.2,z,.035,.6,"#e2c37a",6);box(x,1.15,z-.52,.25,1.6,.12,"#5b4936")}
function addMountain(x,z,w,h,d,color){let a=[x-w/2,0,z-d/2],b=[x+w/2,0,z-d/2],c=[x+w/2,0,z+d/2],e=[x-w/2,0,z+d/2],peak=[x,h,z];tri(a,b,peak,color);tri(b,c,peak,"#746d57");tri(c,e,peak,color);tri(e,a,peak,"#5f604d");tri(a,peak,e,"#8a8061")}

function showPanel(title,html){let p=document.getElementById("campaignPanel");p.innerHTML="<header><b>"+title+"</b><button id='campaignClose'>بستن ✕</button></header><section>"+html+"</section>";p.style.display="block";document.getElementById("campaignClose").onclick=()=>p.style.display="none"}
function showMissions(){let html=missionList.map(m=>{let v=Math.min(m[3],missionCount(m[0])),done=empire.completed.includes(m[0]);return "<article><b>"+m[1]+"</b><small>"+m[2]+"</small><div class='xpbar'><i style='width:"+(v/m[3]*100)+"%'></i></div><small>"+v+"/"+m[3]+" · پاداش "+m[4]+" تجربه</small>"+(done?"<em>تکمیل شد ✓</em>":"<button data-claim='"+m[0]+"' "+(v<m[3]?"disabled":"")+">دریافت پاداش</button>")+"</article>"}).join("");showPanel("مأموریت‌های پادشاهی",html);document.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>{let m=missionList.find(x=>x[0]===b.dataset.claim);if(m&&!empire.completed.includes(m[0])&&missionCount(m[0])>=m[3]){empire.completed.push(m[0]);empireXP(m[4]);showMissions()}})}
const technologies=[["irrigation","آبیاری پیشرفته",1,35,20,25,""],["masonry","سنگ‌تراشی",1,25,55,15,""],["caravan","راه‌های کاروانی",2,55,35,45,"irrigation"],["archery","آموزش کمانداران",2,45,30,35,"masonry"],["metallurgy","فلزکاری",3,65,90,55,"masonry"],["cavalry","سواره‌نظام",3,80,45,70,"caravan"],["fortification","استحکامات",4,75,150,65,"metallurgy"],["medicine","دانش درمان",4,90,75,110,"caravan"],["siegecraft","مهندسی محاصره",5,130,180,110,"fortification"],["diplomacy","دیپلماسی دربار",5,150,90,160,"medicine"],["architecture","معماری باشکوه",6,190,230,150,"siegecraft"],["logistics","تدارکات سپاه",6,180,150,220,"diplomacy"]];
function showResearch(){let html=technologies.map(t=>{let done=empire.research.includes(t[0]),locked=era()+1<t[2]||(t[6]&&!empire.research.includes(t[6]));return "<article><b>"+t[1]+"</b><small>عصر "+t[2]+" · "+t[3]+" چوب، "+t[4]+" سنگ، "+t[5]+" طلا</small>"+(done?"<em>پژوهش شده ✓</em>":"<button data-tech='"+t[0]+"' "+(locked?"disabled":"")+">پژوهش فناوری</button>")+"</article>"}).join("");showPanel("آکادمی و فناوری",html);document.querySelectorAll("[data-tech]").forEach(b=>b.onclick=()=>{let t=technologies.find(x=>x[0]===b.dataset.tech);if(!t||wood<t[3]||stone<t[4]||gold<t[5]){toast("منابع کافی نیست");return}wood-=t[3];stone-=t[4];gold-=t[5];empire.research.push(t[0]);empireXP(100);updateHud();saveGame(false);showResearch()})}
function showArmy(){showPanel("فرماندهی ارتش","<article><b>پیاده‌نظام</b><small>دفاع نزدیک · ۲۵ چوب و ۲۰ غذا</small><button data-unit='militia'>آموزش نگهبان</button></article><article><b>کماندار</b><small>حمله دوربرد · نیازمند فناوری کمانداری</small><button data-unit='archer'>آموزش کماندار</button></article><article><b>سواره‌نظام</b><small>نیروی سریع · نیازمند فناوری سواره‌نظام</small><button data-unit='cavalry'>آموزش سواره</button></article><small>کل نگهبانان: "+guards+"</small>");document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{let type=b.dataset.unit;if(type==="archer"&&!empire.research.includes("archery")||type==="cavalry"&&!empire.research.includes("cavalry")){toast("ابتدا فناوری لازم را پژوهش کن");return}let c=type==="militia"?[25,0,20]:type==="archer"?[35,20,25]:[65,35,50];if(wood<c[0]||stone<c[1]||food<c[2]){toast("منابع کافی نیست");return}wood-=c[0];stone-=c[1];food-=c[2];guards++;people.push({x:Math.random()*8-4,z:Math.random()*8-4,guard:true,type,hp:70});empireXP(15);buildWorld();updateHud();saveGame(false);showArmy()})}
function showBeastStable(){let items=[["lion","شیر نگهبان افسانه‌ای",2,120,60,180,32],["leopard","پلنگ افسانه‌ای",3,150,90,125,24],["snow","پلنگ برفی افسانه‌ای",4,180,120,155,28]];let html=items.map(x=>"<article><b>"+x[1]+"</b><small>گشودن در عصر "+x[2]+" · هزینه "+x[3]+" غذا و "+x[4]+" طلا</small><button data-beast='"+x[0]+"' "+(era()<x[2]?"disabled":"")+">استخدام نگهبان</button></article>").join("");showPanel("زیستگاه نگهبانان افسانه‌ای",html);document.querySelectorAll("[data-beast]").forEach(b=>b.onclick=()=>{let x=items.find(v=>v[0]===b.dataset.beast);if(!x||era()<x[2]){toast("در عصر بالاتر باز می‌شود");return}if(food<x[3]||gold<x[4]){toast("غذا یا طلا کافی نیست");return}food-=x[3];gold-=x[4];beasts.push({kind:x[0],x:Math.random()*12-6,z:Math.random()*12-6,hp:x[5],damage:x[6]});buildWorld();updateHud();saveGame(false);showBeastStable();toast("نگهبان افسانه‌ای به دهکده پیوست")})}
function upgradeEmpire(){if(empire.level>=30){toast("بالاترین سطح پایتخت را داری");return}let c=[90+empire.level*28,65+empire.level*34,20+empire.level*22];if(empire.xp<needXP()||wood<c[0]||stone<c[1]||gold<c[2]){toast("تجربه یا منابع لازم برای ارتقا کافی نیست");return}empire.xp-=needXP();wood-=c[0];stone-=c[1];gold-=c[2];empire.level++;persistEmpire();drawEmpire();updateHud();saveGame(false);toast("پایتخت به سطح "+empire.level+" ارتقا یافت")}
function campaignUI(){let st=document.createElement("style");st.textContent='#empireHud{position:fixed;top:75px;left:9px;width:180px;padding:9px;background:#10231eef;border:1px solid #d9b96b;border-radius:12px;font-size:10px;pointer-events:none;box-shadow:0 5px 18px #0008}#empireHud b{color:#f2d58b}.xpbar{height:6px;background:#ffffff25;border-radius:8px;overflow:hidden;margin:6px 0}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ad813a,#f5dc91)}#empireHud small{color:#e0e4d8}#campaignMenu{position:fixed;right:8px;top:300px;display:grid;gap:6px}#campaignMenu button{font-size:10px;padding:9px}#campaignPanel{display:none;position:fixed;z-index:30;inset:12% 4%;background:#10211ff7;border:1px solid #d9b96b;border-radius:16px;overflow:hidden;box-shadow:0 15px 50px #000b}#campaignPanel header{display:flex;justify-content:space-between;padding:12px;color:#f3d994;border-bottom:1px solid #d9b96b55}#campaignPanel section{height:calc(100% - 48px);overflow:auto;padding:10px;display:grid;align-content:start;gap:8px}#campaignPanel article{padding:10px;background:#ffffff0b;border:1px solid #ffffff20;border-radius:10px;display:grid;gap:5px}#campaignPanel small{font-size:10px;color:#d4d9cc}#campaignPanel em{color:#9fe0aa;font-style:normal}#campaignPanel button:disabled{opacity:.35}@media(max-width:420px){#empireHud{width:155px;font-size:9px}#campaignMenu{top:265px}#campaignMenu button{font-size:9px;padding:8px}}';document.head.appendChild(st);let h=document.createElement("div");h.id="empireHud";document.body.appendChild(h);let m=document.createElement("div");m.id="campaignMenu";m.innerHTML="<button id='missionsBtn'>📜 مأموریت‌ها</button><button id='armyBtn'>⚔️ ارتش</button><button id='beastBtn'>🦁 نگهبانان</button><button id='researchBtn'>📚 فناوری</button><button id='upgradeBtn'>⬆️ ارتقای پایتخت</button>";document.body.appendChild(m);let p=document.createElement("div");p.id="campaignPanel";document.body.appendChild(p);document.getElementById("missionsBtn").onclick=showMissions;document.getElementById("armyBtn").onclick=showArmy;document.getElementById("beastBtn").onclick=showBeastStable;document.getElementById("researchBtn").onclick=showResearch;document.getElementById("upgradeBtn").onclick=upgradeEmpire;drawEmpire()}
campaignUI();
let airRaidCountdown=85;
setInterval(()=>{
 for(let i=raiders.length-1;i>=0;i--){
  const e=raiders[i];let beast=beasts.find(b=>Math.hypot(b.x-e.x,b.z-e.z)<2.2);
  if(beast){beast.hp-=beast.damage*.45;raiders.splice(i,1);empireXP(8);continue}
  if(Math.hypot(e.x-3,e.z-3)<2.5){empire.health=Math.max(0,empire.health-4);raiders.splice(i,1);toast("دشمن به حریم دهکده رسید؛ دفاع را تقویت کن")}
 }
 airRaidCountdown--;
 if(airRaidCountdown<=0){aircraft.push({x:-24,z:Math.random()*14-7});airRaidCountdown=125;toast("هشدار هوایی: هواگرد ناشناس وارد منطقه شد")}
 for(let i=aircraft.length-1;i>=0;i--){let p=aircraft[i];p.x+=.65;if(p.x>24){aircraft.splice(i,1);if(Math.random()<.55){empire.health=Math.max(0,empire.health-8);toast("حمله هوایی به حاشیه دهکده آسیب زد")}}}
 beasts=beasts.filter(b=>b.hp>0);
 if(beasts.length||aircraft.length)buildWorld();
 drawEmpire();saveGame(false);
},1000);
const priorPlaceAt=placeAt;
placeAt=function(x,y){let n=structures.length;priorPlaceAt(x,y);if(structures.length>n){empireXP(25);saveGame(false)}};
const priorSaveGame=saveGame;
saveGame=function(show){priorSaveGame(show);persistEmpire()};

if(vertexCount===0)buildWorld();updateHud();draw();
})();
</script></body></html>
