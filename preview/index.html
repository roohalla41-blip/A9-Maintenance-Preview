<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#172b20"><title>افغانستان قدیم | بازی سه‌بعدی</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18261d;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:9px;pointer-events:none;gap:8px}
.brand,.resources{background:#14251ddd;border:1px solid #b69a5b88;backdrop-filter:blur(7px);box-shadow:0 3px 14px #0005;border-radius:12px}.brand{padding:9px 12px;color:#f2d58b;font-weight:bold;font-size:14px}.brand small{display:block;color:#d1d6c5;font-size:9px;font-weight:normal;margin-top:4px}.resources{display:flex;gap:8px;padding:8px 10px;font-size:11px;direction:rtl}.resources b{color:#f3d17c;font-size:12px}
#right{position:fixed;right:10px;top:100px;display:grid;gap:8px}button{font:inherit;color:#fff;border:1px solid #c5a76599;background:#182d22ed;border-radius:11px;padding:10px 12px;font-size:12px;box-shadow:0 3px 9px #0005}button:active{transform:scale(.96);background:#6a542b}
#bottom{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0);padding:8px;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}#bottom button{min-width:68px;padding:9px 10px}
#buildPanel{position:fixed;bottom:70px;left:8px;right:8px;display:none;grid-template-columns:repeat(4,1fr);gap:6px;background:#14251df0;border:1px solid #b69a5b99;border-radius:13px;padding:8px}#buildPanel button{padding:9px 4px;font-size:11px}
#message{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:#14251de8;border:1px solid #d3b56d;border-radius:20px;padding:8px 14px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}#help{position:fixed;bottom:65px;right:10px;color:#fff;background:#14251dbb;border-radius:9px;padding:7px 9px;font-size:10px;pointer-events:none}
@media(min-width:700px){#right{right:18px;top:110px}#bottom{bottom:15px;justify-content:flex-start;padding:14px}#buildPanel{left:14px;right:auto;width:330px;bottom:75px}#help{right:18px;bottom:85px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="top"><div class="brand">افغانستان قدیم<small>دهکده مستقل · آفلاین و ذخیره روی گوشی</small></div><div class="resources"><span>🪵 <b id="wood">250</b></span><span>🪨 <b id="stone">150</b></span><span>🌾 <b id="food">200</b></span><span>🪙 <b id="gold">100</b></span></div></div>
<div id="right"><button id="save">ذخیره بازی</button><button id="train">آموزش نگهبان</button><button id="zoomIn">＋</button><button id="zoomOut">－</button></div><div id="message"></div><div id="help">انگشت را بکش تا دوربین بچرخد · دو انگشت برای زوم</div>
<div id="buildPanel"><button data-kind="house">🏠 خانه<br>۳۰ چوب</button><button data-kind="tower">🗼 برج<br>۶۵ چوب</button><button data-kind="farm">🌾 مزرعه<br>۲۰ چوب</button><button data-kind="wall">🧱 دیوار<br>۲۵ چوب</button></div>
<div id="bottom"><button id="build">🏗️ ساخت‌وساز</button><button id="cancel">لغو ساخت</button><button id="center">🎯 مرکز دهکده</button></div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),gl=canvas.getContext("webgl",{antialias:true,alpha:false});if(!gl){alert("گرافیک سه‌بعدی در این دستگاه فعال نیست");return}
const vs="attribute vec3 p;attribute vec3 c;uniform mat4 vp;varying vec3 col;void main(){gl_Position=vp*vec4(p,1.0);col=c;}";
const fs="precision mediump float;varying vec3 col;void main(){gl_FragColor=vec4(col,1.0);}";
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);
const pLoc=gl.getAttribLocation(program,"p"),cLoc=gl.getAttribLocation(program,"c"),vpLoc=gl.getUniformLocation(program,"vp");let vertices=[],colors=[],bufferP=gl.createBuffer(),bufferC=gl.createBuffer(),vertexCount=0;
const rgb=h=>{h=h.replace("#","");return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]};
function tri(a,b,c,color){let q=Array.isArray(color)?color:rgb(color);for(const v of [a,b,c]){vertices.push(v[0],v[1],v[2]);colors.push(q[0],q[1],q[2])}}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color)}
function box(x,y,z,w,h,d,color){let x0=x-w/2,x1=x+w/2,y0=y-h/2,y1=y+h/2,z0=z-d/2,z1=z+d/2;quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],color);quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],color);quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],color);quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],color);quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],color);quad([x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0],color)}
function cylinder(x,y,z,r,h,color,n=9){for(let i=0;i<n;i++){let a=i*Math.PI*2/n,b=(i+1)*Math.PI*2/n,p1=[x+Math.cos(a)*r,y-h/2,z+Math.sin(a)*r],p2=[x+Math.cos(b)*r,y-h/2,z+Math.sin(b)*r],p3=[p2[0],y+h/2,p2[2]],p4=[p1[0],y+h/2,p1[2]];quad(p1,p2,p3,p4,color);tri([x,y+h/2,z],p4,p3,color)}}
function sphere(x,y,z,r,color){let n=7,m=10;for(let j=0;j<n;j++)for(let i=0;i<m;i++){let pt=(a,b)=>[x+r*Math.sin(a)*Math.cos(b),y+r*Math.cos(a),z+r*Math.sin(a)*Math.sin(b)],a=j*Math.PI/n,b=(j+1)*Math.PI/n,c=i*Math.PI*2/m,d=(i+1)*Math.PI*2/m;quad(pt(a,c),pt(b,c),pt(b,d),pt(a,d),color)}}
function roof(x,y,z,w,d,color){let a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],e=[x-w/2,y,z+d/2],top=[x,y+Math.min(w,d)*.34,z];tri(a,b,top,color);tri(b,c,top,color);tri(c,e,top,color);tri(e,a,top,color)}
function terrain(){let n=34,size=52,step=size/n;for(let z=0;z<n;z++)for(let x=0;x<n;x++){let xx=-26+x*step,zz=-26+z*step,h=(a,b)=>Math.sin(a*.23)*.22+Math.cos(b*.19)*.18+Math.sin((a+b)*.11)*.12;quad([xx,h(xx,zz),zz],[xx+step,h(xx+step,zz),zz],[xx+step,h(xx+step,zz+step),zz+step],[xx,h(xx,zz+step),zz+step],((x+z)%3===0)?"#716c43":"#777148")}}
let structures=[],people=[],raiders=[],wood=250,stone=150,food=200,gold=100,guards=2,buildMode=false,selected="house",raidTimer=45,raidNo=0;
function addHouse(x,z,scale=1,color="#b58c5d"){box(x,1*scale,z,3.2*scale,2*scale,3*scale,color);roof(x,2*scale,z,3.6*scale,3.4*scale,"#67442d");box(x,.72*scale,z-1.56*scale,.65*scale,1.42*scale,.12*scale,"#50301e")}
function addTower(x,z){cylinder(x,1.5,z,.9,3,"#9d8158");box(x,3.2,z,2,1,2,"#b79a6b");cylinder(x,3.85,z,1.2,.25,"#60442b")}
function addTree(x,z){cylinder(x,.75,z,.22,1.5,"#68452a",7);sphere(x,2,z,.95,"#456b38")}
function buildWorld(){vertices=[];colors=[];terrain();box(-14,.02,0,3.5,.12,52,"#347d91");box(1,.12,-1,2.5,.12,35,"#b39a6c");box(4,.13,4,17,.1,2,"#a88b5d");
for(let i=0;i<26;i++){let x=Math.sin(i*4.3)*21,z=Math.cos(i*3.2)*21;if(Math.abs(x+14)<3||(x>-1&&x<11&&z>-7&&z<10))continue;addTree(x,z)}
addHouse(3,3,1.45,"#c6a06d");addHouse(8,-4,.9);addHouse(8,3,.92,"#9f8158");addHouse(-2,-5,1.05,"#a77d56");addHouse(13,8,.88);addTower(-7,-9);addTower(15,-12);
for(let i=0;i<13;i++){let x=-10+i*2;box(x,1.35,-12,1.85,1.7,.8,"#8f7858");box(x,2.35,-12,.55,.3,.9,"#9c8564")}
box(-2,.25,10,8,.18,6,"#7c7939");for(let i=0;i<7;i++)for(let j=0;j<12;j++)cylinder(-5.3+j*.6,.65,7.8+i*.7,.05,.8,"#d0ad4f",5);
for(const s of structures){if(s.kind==="house")addHouse(s.x,s.z,.9);if(s.kind==="tower")addTower(s.x,s.z);if(s.kind==="farm"){box(s.x,.25,s.z,5,.18,5,"#79743a");for(let i=0;i<5;i++)for(let j=0;j<5;j++)cylinder(s.x-2+j,.65,s.z-2+i,.05,.7,"#d0ad4f",5)}if(s.kind==="wall")box(s.x,1,s.z,4,2,.8,"#9b896d")}
for(const person of people){sphere(person.x,1.35,person.z,.35,person.guard?"#435c83":"#b17b4e");cylinder(person.x,.65,person.z,.22,1,"#805c42",7)}
for(const e of raiders){sphere(e.x,1.3,e.z,.38,"#a83e35");cylinder(e.x,.65,e.z,.23,1.1,"#6f2d2a",7)}upload()}
function upload(){vertexCount=vertices.length/3;gl.bindBuffer(gl.ARRAY_BUFFER,bufferP);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);gl.enableVertexAttribArray(pLoc);gl.vertexAttribPointer(pLoc,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,bufferC);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(colors),gl.STATIC_DRAW);gl.enableVertexAttribArray(cLoc);gl.vertexAttribPointer(cLoc,3,gl.FLOAT,false,0,0)}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],norm=a=>{let l=Math.hypot(...a)||1;return a.map(v=>v/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),nf=1/(near-far);return [f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]}
function lookAt(eye,target){let z=norm(sub(eye,target)),x=norm(cross([0,1,0],z)),y=cross(z,x);return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]}
function multiply(a,b){let o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
let yaw=.7,pitch=.78,distance=32,target=[1,0,0],lastX=0,lastY=0,drag=false;
function camera(){let cp=Math.cos(pitch),sp=Math.sin(pitch),sy=Math.sin(yaw),cy=Math.cos(yaw),eye=[target[0]+distance*cp*sy,target[1]+distance*sp,target[2]+distance*cp*cy];return {eye,forward:norm(sub(target,eye)),right:norm(cross(norm(sub(target,eye)),[0,1,0]))}}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,ratio=Math.min(devicePixelRatio||1,1.7);if(canvas.width!==Math.floor(w*ratio)||canvas.height!==Math.floor(h*ratio)){canvas.width=Math.floor(w*ratio);canvas.height=Math.floor(h*ratio)}gl.viewport(0,0,canvas.width,canvas.height);gl.enable(gl.DEPTH_TEST);gl.clearColor(.48,.62,.67,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let cam=camera(),vp=multiply(perspective(Math.PI/3,canvas.width/canvas.height,.1,180),lookAt(cam.eye,target));gl.useProgram(program);gl.uniformMatrix4fv(vpLoc,false,new Float32Array(vp));gl.drawArrays(gl.TRIANGLES,0,vertexCount);requestAnimationFrame(draw)}
function toast(t){let m=document.getElementById("message");m.textContent=t;m.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>m.style.opacity=0,1900)}
function updateHud(){for(const [id,v] of Object.entries({wood,stone,food,gold}))document.getElementById(id).textContent=Math.floor(v)}
function costs(kind){return kind==="house"?[30,0,10]:kind==="tower"?[65,35,15]:kind==="farm"?[20,5,0]:[25,35,5]}
function placeAt(sx,sy){let rect=canvas.getBoundingClientRect(),nx=(sx-rect.left)/rect.width*2-1,ny=1-(sy-rect.top)/rect.height*2,cam=camera(),up=norm(cross(cam.right,cam.forward)),tan=Math.tan(Math.PI/6),dir=norm([cam.forward[0]+cam.right[0]*nx*tan*rect.width/rect.height+up[0]*ny*tan,cam.forward[1]+cam.right[1]*nx*tan*rect.width/rect.height+up[1]*ny*tan,cam.forward[2]+cam.right[2]*nx*tan*rect.width/rect.height+up[2]*ny*tan]);if(Math.abs(dir[1])<.001)return;let t=-cam.eye[1]/dir[1];if(t<0)return;let x=Math.round(cam.eye[0]+dir[0]*t),z=Math.round(cam.eye[2]+dir[2]*t);if(Math.hypot(x,z)>22||(x>-1&&x<11&&z>-8&&z<10)){toast("این نقطه برای ساخت مناسب نیست");return}let c=costs(selected);if(wood<c[0]||stone<c[1]||food<c[2]){toast("منابع کافی نیست");return}wood-=c[0];stone-=c[1];food-=c[2];structures.push({kind:selected,x,z});buildWorld();updateHud();toast("ساختمان ساخته شد")}
canvas.addEventListener("pointerdown",e=>{if(buildMode){placeAt(e.clientX,e.clientY);return}drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointermove",e=>{if(!drag||buildMode)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;yaw-=dx*.008;pitch=Math.max(.25,Math.min(1.25,pitch+dy*.006));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("pointercancel",()=>drag=false);
let pinch=0;canvas.addEventListener("touchstart",e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)distance=Math.max(15,Math.min(55,distance-(d-pinch)*.07));pinch=d}},{passive:true});
document.getElementById("build").onclick=()=>{buildMode=!buildMode;document.getElementById("buildPanel").style.display=buildMode?"grid":"none";toast(buildMode?"نوع ساختمان را انتخاب کن و روی زمین بزن":"حالت ساخت بسته شد")};document.getElementById("cancel").onclick=()=>{buildMode=false;document.getElementById("buildPanel").style.display="none"};document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{selected=b.dataset.kind;toast("ساختمان انتخاب شد؛ روی زمین بزن")});
document.getElementById("zoomIn").onclick=()=>distance=Math.max(15,distance-3);document.getElementById("zoomOut").onclick=()=>distance=Math.min(55,distance+3);document.getElementById("center").onclick=()=>{target=[1,0,0];yaw=.7;pitch=.78;distance=32};
document.getElementById("train").onclick=()=>{if(wood<25||food<20){toast("برای آموزش نگهبان چوب و غذا کافی نیست");return}wood-=25;food-=20;guards++;people.push({x:Math.random()*8-4,z:Math.random()*8-4,guard:true});buildWorld();updateHud();toast("یک نگهبان تازه آموزش دید")};
function saveGame(showMessage=false){try{const state={version:2,wood,stone,food,gold,guards,structures,people,raiders,raidTimer,raidNo,camera:{yaw,pitch,distance,target},savedAt:Date.now()};localStorage.setItem("afghan-village-save",JSON.stringify(state));if(showMessage)toast("بازی روی همین گوشی ذخیره شد")}catch(e){if(showMessage)toast("حافظه گوشی برای ذخیره‌سازی کافی نیست")}}
document.getElementById("save").onclick=()=>saveGame(true);
try{let s=JSON.parse(localStorage.getItem("afghan-village-save")||"null");if(s&&typeof s==="object"){wood=Number.isFinite(s.wood)?s.wood:wood;stone=Number.isFinite(s.stone)?s.stone:stone;food=Number.isFinite(s.food)?s.food:food;gold=Number.isFinite(s.gold)?s.gold:gold;guards=Number.isFinite(s.guards)?s.guards:guards;structures=Array.isArray(s.structures)?s.structures:[];people=Array.isArray(s.people)?s.people:[];raiders=Array.isArray(s.raiders)?s.raiders:[];raidTimer=Number.isFinite(s.raidTimer)?s.raidTimer:45;raidNo=Number.isFinite(s.raidNo)?s.raidNo:0;if(s.camera){yaw=Number.isFinite(s.camera.yaw)?s.camera.yaw:yaw;pitch=Number.isFinite(s.camera.pitch)?s.camera.pitch:pitch;distance=Number.isFinite(s.camera.distance)?s.camera.distance:distance;if(Array.isArray(s.camera.target)&&s.camera.target.length===3)target=s.camera.target}buildWorld();updateHud()}}catch(e){toast("ذخیره قبلی خوانده نشد؛ بازی تازه آغاز شد")}
setInterval(()=>saveGame(false),10000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveGame(false)});
window.addEventListener("pagehide",()=>saveGame(false));
setInterval(()=>{wood+=2;food+=Math.max(1,Math.floor(guards/2));raidTimer--;if(raidTimer<=0){raidNo++;for(let i=0;i<Math.min(raidNo+2,8);i++)raiders.push({x:Math.cos(i*Math.PI*2/Math.min(raidNo+2,8))*23,z:Math.sin(i*Math.PI*2/Math.min(raidNo+2,8))*23});raidTimer=55;toast("مهاجمان به اطراف دهکده رسیدند!")};updateHud();if(raiders.length){for(const e of raiders){let d=Math.hypot(e.x-3,e.z-3)||1;e.x-=((e.x-3)/d)*.18;e.z-=((e.z-3)/d)*.18}if(raiders.some(e=>Math.hypot(e.x-3,e.z-3)<3)){raiders=[];toast("نگهبانان حمله را دفع کردند")};buildWorld()}},1000);if(vertexCount===0)buildWorld();updateHud();draw();
})();
</script></body></html>
